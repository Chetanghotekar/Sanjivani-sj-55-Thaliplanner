<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 640" width="100%" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">How an LLM generates text</title>
  <desc id="d">Prompt is split into tokens, converted to token IDs, passed through the model, which outputs next-token probabilities. One token is picked and appended to the prompt, repeating until the answer is complete.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#111827}
      .t{font-size:17px;font-weight:700;text-anchor:middle}
      .s{font-size:13px;text-anchor:middle;fill:#374151}
      .l{font-size:13px;font-weight:700;fill:#b45309}
      .ln{stroke:#374151;stroke-width:2;fill:none}
    </style>
  </defs>
  <rect x="0" y="0" width="460" height="640" rx="14" fill="#ffffff" stroke="#d1d5db"/>

  <rect x="80" y="20" width="270" height="62" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text class="t" x="215" y="46">1. Prompt</text>
  <text class="s" x="215" y="66">"Which dishes use moong dal?"</text>

  <line class="ln" x1="215" y1="82" x2="215" y2="112" marker-end="url(#a)"/>

  <rect x="80" y="114" width="270" height="62" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text class="t" x="215" y="140">2. Tokens</text>
  <text class="s" x="215" y="160">Which | dishes | use | moong | dal | ?</text>

  <line class="ln" x1="215" y1="176" x2="215" y2="206" marker-end="url(#a)"/>

  <rect x="80" y="208" width="270" height="62" rx="10" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
  <text class="t" x="215" y="234">3. Token IDs</text>
  <text class="s" x="215" y="254">tokens become numbers: 5043, 8791, ...</text>

  <line class="ln" x1="215" y1="270" x2="215" y2="300" marker-end="url(#a)"/>

  <rect x="80" y="302" width="270" height="70" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text class="t" x="215" y="330">4. Model</text>
  <text class="s" x="215" y="350">neural network + attention</text>
  <text class="s" x="215" y="366">(billions of learned weights)</text>

  <line class="ln" x1="215" y1="372" x2="215" y2="402" marker-end="url(#a)"/>

  <rect x="80" y="404" width="270" height="70" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text class="t" x="215" y="430">5. Next-token probabilities</text>
  <text class="s" x="215" y="450">Moong 41%  |  Khichdi 18%  |  ...</text>
  <text class="s" x="215" y="466">pick one token (temperature)</text>

  <line class="ln" x1="215" y1="474" x2="215" y2="504" marker-end="url(#a)"/>

  <rect x="80" y="506" width="270" height="62" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text class="t" x="215" y="532">6. Chosen token</text>
  <text class="s" x="215" y="552">" Moong" is added to the text</text>

  <!-- loop back to prompt -->
  <path class="ln" d="M350 537 H420 V51 H350" marker-end="url(#a)" stroke-dasharray="6 4"/>
  <text class="l" x="428" y="300" transform="rotate(90 428 300)" text-anchor="middle">repeat until stop token</text>

  <line class="ln" x1="215" y1="568" x2="215" y2="596" marker-end="url(#a)"/>
  <rect x="110" y="598" width="210" height="32" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
  <text class="t" x="215" y="620" style="font-size:15px">Final answer</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
